<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ritika Khurana | Portfolio</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f9fafb;
      color: #1f2937;
      position: relative;
      overflow-x: hidden;
    }

    .chart-background {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
      background-color: transparent;
    }

    .chart-shape {
      position: absolute;
      fill: none;
      stroke-width: 2;
      stroke: rgba(37, 99, 235, 0.1); /* stronger visible blue stroke */
      animation: floatChart 18s ease-in-out infinite;
    }

    @keyframes floatChart {
      0% {
        transform: translateY(0) scale(1);
        opacity: 0.15;
      }
      50% {
        transform: translateY(-20px) scale(1.05);
        opacity: 0.35;
      }
      100% {
        transform: translateY(0) scale(1);
        opacity: 0.15;
      }
    }

    /* Floating keywords style */
    .floating-keyword {
      position: fixed;
      font-weight: 700;
      font-size: 1.2rem;
      color: rgba(37, 99, 235, 0.3);
      user-select: none;
      pointer-events: none;
      white-space: nowrap;
      animation: floatKeywords 6s ease-in-out infinite;
      will-change: transform, opacity;
    }

    @keyframes floatKeywords {
      0%, 100% {
        transform: translateY(0);
        opacity: 0.3;
      }
      50% {
        transform: translateY(-20px);
        opacity: 0.6;
      }
    }

    /* Container and layout styles (abbreviated for brevity) */
    .container { display: flex; min-height: 100vh; position: relative; z-index: 10; }
    .left, .right { width: 25%; padding: 30px 20px; background-color: #f3f4f6; }
    .middle { width: 50%; padding: 40px 30px; background-color: #fff; }
    /* ... other styles omitted for brevity ... */
  </style>
</head>
<body>
  <div class="chart-background" id="chartBackground"></div>

  <div class="container">
    <!-- LEFT PANEL -->
    <aside class="left">
      <img src="image/photo.jpg" alt="Ritika's Photo" class="profile-pic" />
      <h1>Ritika Khurana</h1>
      <p class="intro">IIBA Certified Business Data Analyst... [truncated]</p>
    </aside>

    <!-- MIDDLE CONTENT -->
    <main class="middle">
      <!-- Your content here -->
    </main>

    <!-- RIGHT PANEL -->
    <aside class="right">
      <!-- Your content here -->
    </aside>
  </div>

  <footer>© 2025 Ritika Khurana. All rights reserved.</footer>

<script>
  // Background charts generation and looping every 10 seconds
  const chartBackground = document.getElementById("chartBackground");

  function clearCharts() {
    while (chartBackground.firstChild) {
      chartBackground.removeChild(chartBackground.firstChild);
    }
  }

  function createLineChart() {
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.classList.add("chart-shape");
    svg.setAttribute("viewBox", "0 0 100 50");
    svg.style.top = `${Math.random() * 90}%`;
    svg.style.left = `${Math.random() * 90}%`;
    svg.style.width = `${Math.random() * 120 + 80}px`;
    svg.style.height = `${Math.random() * 50 + 40}px`;
    svg.style.animationDelay = `${Math.random() * 8}s`;

    const points = Array.from({ length: 6 }, (_, i) => {
      const x = i * 20;
      const y = Math.floor(Math.random() * 40) + 5;
      return `${x},${y}`;
    }).join(" ");

    const polyline = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
    polyline.setAttribute("points", points);
    polyline.setAttribute("stroke", "rgba(37, 99, 235, 0.2)");
    polyline.setAttribute("fill", "none");

    svg.appendChild(polyline);
    chartBackground.appendChild(svg);
  }

  function createBarChart() {
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.classList.add("chart-shape");
    svg.setAttribute("viewBox", "0 0 100 50");
    svg.style.top = `${Math.random() * 90}%`;
    svg.style.left = `${Math.random() * 90}%`;
    svg.style.width = `${Math.random() * 100 + 50}px`;
    svg.style.height = `${Math.random() * 60 + 30}px`;
    svg.style.animationDelay = `${Math.random() * 10}s`;

    for (let i = 0; i < 5; i++) {
      const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
      rect.setAttribute("x", `${i * 20 + 5}`);
      rect.setAttribute("width", "10");
      rect.setAttribute("y", `${Math.random() * 25 + 10}`);
      rect.setAttribute("height", `${Math.random() * 20 + 5}`);
      rect.setAttribute("fill", "rgba(37, 99, 235, 0.1)");
      svg.appendChild(rect);
    }

    chartBackground.appendChild(svg);
  }

  function generateCharts() {
    clearCharts();
    for (let i = 0; i < 6; i++) {
      createLineChart();
      createBarChart();
    }
  }

  generateCharts();
  setInterval(generateCharts, 10000);
</script>

<script>
  // Floating keywords
  const keywords = ["SQL", "ETL", "Power BI"];
  const floatingKeywords = [];

  function createFloatingKeyword(text) {
    const span = document.createElement('span');
    span.classList.add('floating-keyword');
    span.innerText = text;
    span.style.top = `${Math.random() * 80 + 10}%`;
    span.style.left = `${Math.random() * 90 + 5}%`;
    span.style.fontSize = `${Math.random() * 16 + 14}px`;
    span.style.animationDuration = `${Math.random() * 6 + 4}s`;
    document.body.appendChild(span);
    floatingKeywords.push(span);
  }

  function moveFloatingKeywords() {
    floatingKeywords.forEach(span => {
      let top = parseFloat(span.style.top);
      let left = parseFloat(span.style.left);

      // Move ±1.5%
      top += (Math.random() * 3 - 1.5);
      left += (Math.random() * 3 - 1.5);

      // Keep within 5% - 95%
      top = Math.min(Math.max(top, 5), 95);
      left = Math.min(Math.max(left, 2), 95);

      span.style.top = `${top}%`;
      span.style.left = `${left}%`;
    });
  }

  for (let i = 0; i < 10; i++) {
    createFloatingKeyword(keywords[i % keywords.length]);
  }

  setInterval(moveFloatingKeywords, 3000);
</script>

</body>
</html>
